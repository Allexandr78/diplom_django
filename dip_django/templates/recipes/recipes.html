{% extends 'base.html' %}
{% load static %}

{% block card %}
  <div class="container mt-4">
    <div class="row gy-4">
      {% for recip in recipes %}
        <div class="col-md-4">
          <div class="card shadow-sm">
            <img src="{{ recip.image.url }}" class="card-img-top" alt="{{ recip.title }}" />
            <div class="card-body">
              <h5 class="card-title">{{ recip.title }}</h5>
              <p class="card-text">{{ recip.description|truncatechars:100 }}</p>
              <a href="{% url 'dish_detail' recip.id %}" class="btn btn-secondary">Подробнее</a>
            </div>
          </div>
        </div>
      {% endfor %}
      <div class="col-md-4">
        <div class="card shadow-sm border-dashed text-center d-flex justify-content-center align-items-center" style="height: 100%;">
          <div class="card-body">
            <img src="{% static 'img/free-icon-cook-book-2253457.png' %}" alt="Добавить рецепт" class="img-fluid mb-3" style="max-width: 
            200px;">
            <h5 class="card-title">Добавить рецепт</h5>
            <p class="card-text">Создайте свой уникальный рецепт!</p>
            <a href="{% url 'add_recipe' %}" class="btn btn-secondary">Добавить</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
