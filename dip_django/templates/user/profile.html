{% extends 'base.html' %}
{% load static %}

{% block content %}
  <div class="col-md-5">
    <div class="bg-white p-4 mb-4 mx-2 rounded custom-shadow">
      <h3 class="text-center mb-4">Профиль пользователя</h3>
      <form action="{% url 'user:profile' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          <div class="col-md-12 mb-3 text-center">
            {% if user.image %}
              <img src="{{ user.image.url }}" alt="Аватар пользователя" class="img-fluid rounded-circle" style="max-width: 150px;" />
            {% else %}
              <img src="{% static 'img/user/baseavatar.jpg' %}" alt="Аватар пользователя" class="img-fluid rounded-circle" style="max-width: 150px;" />
            {% endif %}

            <input type="file" class="form-control mt-3" id="id_image" name="image" accept="image/*" />
          </div>
        </div>
        <button type="submit" class="btn btn-dark">Сохранить</button>
      </form>
    </div>
  </div>
{% endblock %}
