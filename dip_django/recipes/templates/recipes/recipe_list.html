<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейное меню</title>
</head>
<body>
    <h1>Блюда</h1>
    <ul>
        {% for recipe in recipes %}
            <li><strong>{{ recipe.title }}</strong> - {{ recipe.description }}</li>
            {% comment %} <li><h1>Ингридиенты</h1> {{recipe.ingredients}} </li>
            <li><h1>Рецепт</h1> {{recipe.instructions}} </li> {% endcomment %}
        {% endfor %}
    </ul>
</body>
</html>
